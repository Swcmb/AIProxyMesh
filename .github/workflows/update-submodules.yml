name: Update submodules

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-submodules
  cancel-in-progress: false

jobs:
  update:
    name: Update Resin and opencode2api
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Update submodule pointers
        id: update
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git submodule update --remote Resin opencode2api
          if git diff --quiet -- Resin opencode2api; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream submodule updates."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --submodule=short -- Resin opencode2api
          git add Resin opencode2api
          git commit -m "chore: 更新子模块 Resin/opencode2api 到上游最新提交"
          git push origin HEAD:main

      - name: Trigger checks workflow
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref main

  notify:
    name: Notify on failure
    needs: update
    if: failure()
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow_name: Update submodules
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
